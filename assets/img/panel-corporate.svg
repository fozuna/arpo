<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1E3A"/>
      <stop offset="1" stop-color="#0C162C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- boardroom table -->
  <rect x="220" y="220" width="1480" height="640" rx="26" fill="url(#glass)" stroke="#94A3B8" stroke-opacity="0.25"/>
  <!-- laptops -->
  <g opacity="0.9">
    <rect x="320" y="300" width="280" height="180" rx="12" fill="#121826" stroke="#94A3B8" stroke-opacity="0.35"/>
    <rect x="1320" y="320" width="280" height="180" rx="12" fill="#121826" stroke="#94A3B8" stroke-opacity="0.35"/>
  </g>
  <!-- charts on screens -->
  <g>
    <polyline points="350,420 380,410 410,430 440,360 470,390 500,350 530,370 560,340 590,355" fill="none" stroke="#F26A2E" stroke-width="4" stroke-linecap="round"/>
    <polyline points="1350,430 1380,410 1410,420 1440,380 1470,390 1500,360 1530,370 1560,340 1590,350" fill="none" stroke="#D21C5A" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- people silhouettes minimal -->
  <g fill="#1F2938" opacity="0.9">
    <circle cx="640" cy="680" r="36"/>
    <rect x="600" y="700" width="80" height="120" rx="20"/>
    <circle cx="980" cy="680" r="36"/>
    <rect x="940" y="700" width="80" height="120" rx="20"/>
    <circle cx="1280" cy="680" r="36"/>
    <rect x="1240" y="700" width="80" height="120" rx="20"/>
  </g>
  <!-- subtle grid -->
  <g stroke="#94A3B8" stroke-opacity="0.12" stroke-width="1">
    <line x1="220" y1="540" x2="1700" y2="540"/>
    <line x1="960" y1="220" x2="960" y2="860"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1E3A"/>
      <stop offset="1" stop-color="#0C162C"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="260" y="220" width="1400" height="640" rx="26" fill="#121826" opacity="0.6"/>
  <!-- risk matrix -->
  <g transform="translate(360,300)">
    <rect width="600" height="400" rx="14" fill="#0E1A32" stroke="#94A3B8" stroke-opacity="0.35"/>
    <g stroke="#233149" stroke-opacity="0.7">
      <line x1="0" y1="100" x2="600" y2="100"/><line x1="0" y1="200" x2="600" y2="200"/><line x1="0" y1="300" x2="600" y2="300"/>
      <line x1="200" y1="0" x2="200" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    </g>
    <rect x="400" y="0" width="200" height="100" fill="#D21C5A" opacity="0.8"/>
    <rect x="200" y="200" width="200" height="100" fill="#F26A2E" opacity="0.85"/>
    <rect x="0" y="300" width="200" height="100" fill="#7FB8D2" opacity="0.5"/>
  </g>
  <!-- legend -->

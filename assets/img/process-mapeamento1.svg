    <rect x="40" y="50" width="24" height="24" rx="4" fill="#D21C5A"/><text x="80" y="68" fill="#D8E0EA" font-family="Inter" font-weight="600" font-size="20">Alto</text>
    <rect x="40" y="110" width="24" height="24" rx="4" fill="#F26A2E"/><text x="80" y="128" fill="#D8E0EA" font-family="Inter" font-weight="600" font-size="20">Médio</text>
    <rect x="40" y="170" width="24" height="24" rx="4" fill="#7FB8D2"/><text x="80" y="188" fill="#D8E0EA" font-family="Inter" font-weight="600" font-size="20">Baixo</text>
  </g>

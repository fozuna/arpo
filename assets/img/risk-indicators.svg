<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF3F9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" rx="22" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="520" rx="18" fill="#FFFFFF" stroke="#E6E9F0"/>
  <!-- Risk indicators -->
  <g transform="translate(120,120)">
    <rect width="960" height="280" rx="14" fill="#0E1A32" opacity="0.08"/>
    <!-- heat cells -->
    <g opacity="0.85">
      <rect x="40" y="40" width="220" height="80" rx="10" fill="#D21C5A"/>
      <rect x="280" y="40" width="220" height="80" rx="10" fill="#F26A2E"/>
      <rect x="520" y="40" width="220" height="80" rx="10" fill="#94A3B8"/>
      <rect x="760" y="40" width="160" height="80" rx="10" fill="#94A3B8" opacity="0.6"/>
      <rect x="280" y="160" width="220" height="80" rx="10" fill="#D21C5A"/>
      <rect x="520" y="160" width="220" height="80" rx="10" fill="#F26A2E"/>
      <rect x="760" y="160" width="160" height="80" rx="10" fill="#94A3B8" opacity="0.6"/>
    </g>
    <!-- legend -->
    <g transform="translate(0,220)" opacity="0.9">
      <rect x="0" y="100" width="18" height="18" rx="4" fill="#D21C5A"/><text x="26" y="114" font-family="Inter, Arial" font-size="16" fill="#334155">Alto risco</text>
      <rect x="160" y="100" width="18" height="18" rx="4" fill="#F26A2E"/><text x="186" y="114" font-family="Inter, Arial" font-size="16" fill="#334155">Médio</text>
      <rect x="280" y="100" width="18" height="18" rx="4" fill="#94A3B8"/><text x="306" y="114" font-family="Inter, Arial" font-size="16" fill="#334155">Baixo</text>
    </g>
  </g>
